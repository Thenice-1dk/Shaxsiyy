<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Qarzlarim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF1F4; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#6B7280;
    --border:#E1E4E9; --primary:#1E4B4C; --primary-ink:#FFFFFF; --rust:#B5502F; --rust-soft:#FBEAE3;
    --green:#3B7A57; --green-soft:#E7F2EC;
    --shadow: 0 1px 2px rgba(23,26,33,0.04), 0 8px 24px rgba(23,26,33,0.06);
    --radius: 18px; --radius-sm: 12px;
  }
  [data-theme="dark"]{
    --bg:#0F1218; --surface:#181C25; --surface-2:#1F2430; --ink:#ECEEF2; --muted:#8B92A3;
    --border:#2A2F3B; --primary:#5AACA8; --primary-ink:#0F1218; --rust:#E08A63; --rust-soft:#3A241D;
    --green:#7FCBA1; --green-soft:#1C3327;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; transition: background .25s ease, color .25s ease; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric: tabular-nums; }
  #app{ max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:96px; }

  .header{ display:flex; align-items:center; justify-content:space-between; padding:24px 20px 8px; }
  .header h1{ font-size:24px; font-weight:800; margin:0; letter-spacing:-0.02em; }
  .header .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
  .header-actions{ display:flex; gap:8px; }
  .icon-btn{ width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); transition: transform .15s ease, background .2s ease; }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform:scale(0.94); }

  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 20px 4px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; box-shadow:var(--shadow); }
  .stat-card .label{ font-size:12px; color:var(--muted); font-weight:600; }
  .stat-card .value{ font-size:18px; font-weight:700; margin-top:6px; letter-spacing:-0.01em; }
  .stat-card.debt .value{ color:var(--rust); }
  .stat-card.paid .value{ color:var(--green); }

  .controls{ padding:16px 20px 8px; display:flex; flex-direction:column; gap:10px; }
  .search-wrap{ position:relative; }
  .search-wrap input{ width:100%; padding:11px 14px 11px 38px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit; outline:none; }
  .search-wrap input:focus{ border-color:var(--primary); }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .filter-row{ display:flex; gap:8px; }
  select{ flex:1; padding:9px 10px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px; font-family:inherit; outline:none; }

  .section-title{ padding:14px 20px 6px; font-size:13px; font-weight:700; color:var(--muted); }

  .list{ padding:4px 20px; display:flex; flex-direction:column; gap:10px; }
  .debt-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); cursor:pointer; transition: transform .15s ease, border-color .2s ease; }
  .debt-card:active{ transform:scale(0.985); }
  .debt-card .row-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .debt-card .name{ font-size:16px; font-weight:700; }
  .debt-card .remaining{ font-size:20px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; }
  .debt-card .remaining.owed{ color:var(--rust); }
  .debt-card .remaining.done{ color:var(--green); }
  .debt-card .meta{ font-size:12.5px; color:var(--muted); margin-top:8px; }
  .debt-card .date{ font-size:12px; color:var(--muted); margin-top:4px; }
  .debt-card .actions-row{ margin-top:12px; display:flex; gap:8px; }
  .btn{ border:none; border-radius:12px; padding:10px 14px; font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; transition: opacity .15s ease, transform .1s ease; }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-primary:hover{ opacity:0.92; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); }
  .btn-danger{ background:transparent; color:var(--rust); border:1px solid var(--rust); }
  .btn-block{ width:100%; }
  .paid-badge{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--green); background:var(--green-soft); padding:4px 10px; border-radius:20px; margin-top:10px; }

  .empty{ text-align:center; padding:60px 24px; color:var(--muted); }
  .empty .emoji{ font-size:38px; margin-bottom:10px; }
  .empty p{ font-size:15px; margin:0 0 18px; }

  .error-banner{ margin:12px 20px; background:var(--rust-soft); color:var(--rust); border-radius:12px; padding:12px 14px; font-size:13px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .error-banner button{ background:none; border:1px solid var(--rust); color:var(--rust); border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; flex-shrink:0; }

  .skeleton{ background:linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:var(--radius); height:88px; margin:0 20px 10px; }
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .fab{ position:fixed; bottom:28px; right:20px; background:var(--primary); color:var(--primary-ink); border:none; width:56px; height:56px; border-radius:18px; box-shadow:0 10px 24px rgba(0,0,0,0.22); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20; transition: transform .15s ease; }
  .fab:active{ transform:scale(0.92); }

  .overlay{ position:fixed; inset:0; background:rgba(10,12,16,0.5); z-index:30; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{ background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); transform:translateY(24px); transition:transform .22s ease; max-height:88vh; overflow-y:auto; }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 16px; }
  .sheet h2{ font-size:18px; margin:0 0 16px; font-weight:800; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field input, .field textarea, .field select{ width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:15px; font-family:inherit; outline:none; }
  .field input:focus, .field textarea:focus{ border-color:var(--primary); }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-error{ color:var(--rust); font-size:12.5px; margin-top:6px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }

  .detail-view{ position:fixed; inset:0; background:var(--bg); z-index:25; transform:translateX(100%); transition:transform .24s ease; overflow-y:auto; }
  .detail-view.open{ transform:translateX(0); }
  .detail-inner{ max-width:560px; margin:0 auto; padding-bottom:60px; }
  .detail-header{ display:flex; align-items:center; gap:12px; padding:20px; }
  .detail-header .name{ font-size:18px; font-weight:800; flex:1; }
  .detail-hero{ padding:4px 20px 20px; }
  .detail-hero .label{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .detail-hero .remaining{ font-size:36px; font-weight:700; margin-top:6px; letter-spacing:-0.02em; }
  .breakdown{ display:flex; gap:10px; margin-top:16px; }
  .breakdown .item{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; min-width:0; }
  .breakdown .item .l{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .breakdown .item .v{ font-size:14px; font-weight:700; margin-top:4px; overflow-wrap:break-word; }
  .detail-date{ font-size:13px; color:var(--muted); margin-top:14px; }
  .detail-note{ font-size:13.5px; color:var(--ink); margin-top:8px; background:var(--surface); border-radius:12px; padding:10px 12px; border:1px solid var(--border); }
  .detail-actions{ display:flex; gap:10px; padding:18px 20px 0; flex-wrap:wrap; }
  .history-title{ padding:20px 20px 8px; font-size:14px; font-weight:700; }
  .payment-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-top:1px solid var(--border); gap:10px; }
  .payment-row .left .amt{ font-size:15px; font-weight:700; }
  .payment-row .left .d{ font-size:12px; color:var(--muted); margin-top:2px; }
  .payment-row .left .note{ font-size:12px; color:var(--muted); margin-top:2px; font-style:italic; }
  .payment-row .icons{ display:flex; gap:6px; flex-shrink:0; }
  .icon-sm{ width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); }
  .icon-sm:hover{ color:var(--ink); }
  .history-total{ display:flex; justify-content:space-between; padding:14px 20px; font-weight:700; font-size:14px; border-top:1px solid var(--border); background:var(--surface-2); }

  .confirm-sheet p{ font-size:14.5px; color:var(--ink); margin:0 0 18px; }
  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:13.5px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:all .25s ease; max-width:80%; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Auth screen */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:380px; }
  .auth-title{ font-size:26px; font-weight:800; margin-bottom:4px; letter-spacing:-0.02em; }
  .auth-sub{ font-size:14px; color:var(--muted); margin-bottom:26px; }
  .tabs{ display:flex; gap:6px; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:22px; }
  .tab{ flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--muted); }
  .tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .auth-note{ font-size:12.5px; color:var(--muted); margin-top:14px; text-align:center; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://rrluvxkdqdjcdpzrqsqx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJybHV2eGtkcWRqY2RwenJxc3F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNzI2MzEsImV4cCI6MjEwMzk0ODYzMX0.mLcqde77-iheXT7ZryCLn9Ye04k50qFNfgcPJJ2UMPE';

const CURRENCIES = {
  USD:{ symbol:'$', prefix:true, decimals:2, name:'AQSH dollari' },
  EUR:{ symbol:'€', prefix:true, decimals:2, name:'Yevro' },
  GBP:{ symbol:'£', prefix:true, decimals:2, name:'Funt sterling' },
  UZS:{ symbol:"so'm", prefix:false, decimals:0, name:"O'zbek so'mi" },
  RUB:{ symbol:'₽', prefix:false, decimals:0, name:'Rossiya rubli' },
  KZT:{ symbol:'₸', prefix:false, decimals:0, name:'Qozog\'iston tengesi' },
};

const state = {
  theme:'light', currency:'USD',
  session:null, authMode:'signin', authError:null, authLoading:false,
  debts:[], loading:true, error:null,
  search:'', filter:'all', sort:'remaining_asc',
  detailId:null, modal:null, settingsOpen:false, toast:null,
};

function todayStr(){ return new Date().toISOString().slice(0,10); }

function fmtMoney(n){
  const cur = CURRENCIES[state.currency] || CURRENCIES.USD;
  const num = Number(n)||0;
  const fixed = cur.decimals>0 ? num.toFixed(cur.decimals) : Math.round(num).toString();
  let [intPart, decPart] = fixed.split('.');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, cur.prefix ? ',' : ' ');
  const numStr = decPart!==undefined ? `${intPart}.${decPart}` : intPart;
  return cur.prefix ? `${cur.symbol}${numStr}` : `${numStr} ${cur.symbol}`;
}
function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}.${m}.${y}`;
}

/* ---------- Auth ---------- */
async function authRequest(path, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || 'Xatolik yuz berdi'); }
  return data;
}
async function persistSession(data){
  state.session = {
    access_token:data.access_token, refresh_token:data.refresh_token,
    user:data.user, expires_at: Date.now() + (data.expires_in*1000),
  };
  try{ await window.storage.set('session', JSON.stringify({refresh_token:data.refresh_token})); }catch(e){}
}
async function restoreSession(){
  try{
    const r = await window.storage.get('session');
    if(!r) return false;
    const { refresh_token } = JSON.parse(r.value);
    const data = await authRequest('token?grant_type=refresh_token', { refresh_token });
    await persistSession(data);
    return true;
  }catch(e){ return false; }
}
async function doSignIn(email, password){
  state.authLoading = true; state.authError = null; render();
  try{
    const data = await authRequest('token?grant_type=password', { email, password });
    await persistSession(data);
    state.authLoading = false; render();
    await loadDebts();
  }catch(e){
    state.authLoading = false; state.authError = e.message; render();
  }
}
async function doSignUp(email, password){
  state.authLoading = true; state.authError = null; render();
  try{
    const data = await authRequest('signup', { email, password });
    state.authLoading = false;
    if(data.access_token){
      await persistSession(data);
      render(); await loadDebts();
    } else {
      state.authMode = 'signin';
      state.authError = "Ro'yxatdan o'tdingiz. Emailingizga kelgan havolani tasdiqlang, keyin kiring.";
      render();
    }
  }catch(e){
    state.authLoading = false; state.authError = e.message; render();
  }
}
async function doLogout(){
  try{ await fetch(`${SUPABASE_URL}/auth/v1/logout`, { method:'POST', headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${state.session.access_token}` } }); }catch(e){}
  state.session = null; state.debts = []; state.settingsOpen = false;
  try{ await window.storage.delete('session'); }catch(e){}
  render();
}

async function sb(path, opts={}){
  const token = state.session ? state.session.access_token : SUPABASE_ANON_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: opts.method || 'GET',
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json', 'Prefer': opts.prefer || 'return=representation' },
    body: opts.body,
  });
  if(!res.ok){
    let msg = `Xatolik (${res.status})`;
    try{ const j = await res.json(); msg = j.message || j.hint || msg; }catch(e){}
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function computeDebt(d){
  const paid = (d.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
  const remaining = Math.max(0, Number(d.original_amount) - paid);
  return { ...d, paidTotal:paid, remaining, isPaid: remaining <= 0 };
}
async function loadDebts(){
  state.loading = true; state.error = null; render();
  try{
    const rows = await sb('debts?select=*,payments(*)&order=created_at.desc');
    state.debts = rows.map(computeDebt);
    state.loading = false;
  }catch(e){
    state.loading = false;
    state.error = `Ma'lumotni yuklashda xatolik yuz berdi: ${e.message}`;
  }
  render();
}
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast = null; render(); }, 2200); }

/* ---------- Theme / currency persistence ---------- */
async function loadTheme(){
  try{ const r = await window.storage.get('theme'); state.theme = (r && r.value) ? r.value : 'light'; }catch(e){ state.theme = 'light'; }
  document.documentElement.setAttribute('data-theme', state.theme);
}
async function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
  try{ await window.storage.set('theme', state.theme); }catch(e){}
}
async function loadCurrency(){
  try{ const r = await window.storage.get('currency'); state.currency = (r && r.value && CURRENCIES[r.value]) ? r.value : 'USD'; }catch(e){ state.currency = 'USD'; }
}
async function setCurrency(code){
  state.currency = code; render();
  try{ await window.storage.set('currency', code); }catch(e){}
}

/* ---------- CRUD ---------- */
async function createDebt(data){
  await sb('debts', { method:'POST', body: JSON.stringify([{ person_name:data.person_name, original_amount:data.original_amount, borrowed_date:data.borrowed_date, note:data.note || null }]) });
  closeModal(); await loadDebts(); showToast('Qarz qoshildi');
}
async function updateDebt(id, data){
  await sb(`debts?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ person_name:data.person_name, original_amount:data.original_amount, borrowed_date:data.borrowed_date, note:data.note || null, updated_at:new Date().toISOString() }) });
  closeModal(); await loadDebts(); showToast('Ozgarishlar saqlandi');
}
async function deleteDebtFn(id){
  await sb(`debts?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' });
  closeModal(); state.detailId = null; await loadDebts(); showToast("Qarz ochirildi");
}
async function createPayment(debtId, data){
  await sb('payments', { method:'POST', body: JSON.stringify([{ debt_id:debtId, amount:data.amount, payment_date:data.payment_date, note:data.note || null }]) });
  closeModal(); await loadDebts(); showToast("To'lov qoshildi");
}
async function updatePayment(id, data){
  await sb(`payments?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ amount:data.amount, payment_date:data.payment_date, note:data.note || null, updated_at:new Date().toISOString() }) });
  closeModal(); await loadDebts(); showToast("To'lov yangilandi");
}
async function deletePaymentFn(id){
  await sb(`payments?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' });
  closeModal(); await loadDebts(); showToast("To'lov ochirildi");
}

function openModal(type, payload){ state.modal = { type, payload, error:null }; render(); }
function closeModal(){ state.modal = null; render(); }

function getVisibleDebts(){
  let list = [...state.debts];
  if(state.search.trim()){ const q = state.search.trim().toLowerCase(); list = list.filter(d => d.person_name.toLowerCase().includes(q)); }
  if(state.filter === 'active') list = list.filter(d => !d.isPaid);
  if(state.filter === 'paid') list = list.filter(d => d.isPaid);
  switch(state.sort){
    case 'remaining_asc': list.sort((a,b)=>a.remaining-b.remaining); break;
    case 'remaining_desc': list.sort((a,b)=>b.remaining-a.remaining); break;
    case 'newest': list.sort((a,b)=> new Date(b.borrowed_date)-new Date(a.borrowed_date)); break;
    case 'oldest': list.sort((a,b)=> new Date(a.borrowed_date)-new Date(b.borrowed_date)); break;
  }
  return list;
}

function icon(name){
  const icons = {
    sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
    search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
    trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  };
  return icons[name] || '';
}

/* ---------- Render: Auth screen ---------- */
function renderAuth(){
  const m = state.authMode;
  return `
    <div class="auth-wrap"><div class="auth-card">
      <div class="auth-title">Qarzlarim</div>
      <div class="auth-sub">Hisobingizga kiring</div>
      <div class="tabs">
        <div class="tab ${m==='signin'?'active':''}" id="tabSignin">Kirish</div>
        <div class="tab ${m==='signup'?'active':''}" id="tabSignup">Ro'yxatdan o'tish</div>
      </div>
      <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="email@misol.com" autocomplete="username"></div>
      <div class="field"><label>Parol</label><input id="authPassword" type="password" placeholder="••••••••" autocomplete="${m==='signin'?'current-password':'new-password'}"></div>
      ${state.authError ? `<div class="field-error">${escapeHtml(state.authError)}</div>` : ''}
      <button class="btn btn-primary btn-block" id="authSubmit" ${state.authLoading?'disabled':''}>${state.authLoading ? 'Yuklanmoqda...' : (m==='signin' ? 'Kirish' : "Ro'yxatdan o'tish")}</button>
      <div class="auth-note">${m==='signin' ? "Hisobingiz yoqmi? Yuqoridan ro'yxatdan o'ting." : "Kamida 6 belgidan iborat parol tanlang."}</div>
    </div></div>`;
}

/* ---------- Render: main app pieces ---------- */
function renderStats(){
  const totalOriginal = state.debts.reduce((s,d)=>s+Number(d.original_amount),0);
  const totalPaid = state.debts.reduce((s,d)=>s+d.paidTotal,0);
  const totalRemaining = state.debts.reduce((s,d)=>s+d.remaining,0);
  const activeCount = state.debts.filter(d=>!d.isPaid).length;
  return `
    <div class="stats">
      <div class="stat-card debt"><div class="label">Jami qarz</div><div class="value mono">${fmtMoney(totalRemaining)}</div></div>
      <div class="stat-card"><div class="label">Jami olingan</div><div class="value mono">${fmtMoney(totalOriginal)}</div></div>
      <div class="stat-card paid"><div class="label">Jami tolangan</div><div class="value mono">${fmtMoney(totalPaid)}</div></div>
      <div class="stat-card"><div class="label">Faol qarzlar</div><div class="value mono">${activeCount}</div></div>
    </div>`;
}
function renderControls(){
  return `
    <div class="controls">
      <div class="search-wrap">${icon('search')}<input id="searchInput" type="text" placeholder="Qarz egasini qidirish..." value="${escapeAttr(state.search)}"></div>
      <div class="filter-row">
        <select id="filterSelect">
          <option value="all" ${state.filter==='all'?'selected':''}>Barchasi</option>
          <option value="active" ${state.filter==='active'?'selected':''}>Faol qarzlar</option>
          <option value="paid" ${state.filter==='paid'?'selected':''}>Tolangan qarzlar</option>
        </select>
        <select id="sortSelect">
          <option value="remaining_asc" ${state.sort==='remaining_asc'?'selected':''}>Eng kam qarz</option>
          <option value="remaining_desc" ${state.sort==='remaining_desc'?'selected':''}>Eng katta qarz</option>
          <option value="newest" ${state.sort==='newest'?'selected':''}>Eng yangi</option>
          <option value="oldest" ${state.sort==='oldest'?'selected':''}>Eng eski</option>
        </select>
      </div>
    </div>`;
}
function renderDebtCard(d){
  return `
    <div class="debt-card" data-open-detail="${d.id}">
      <div class="row-top"><div class="name">${escapeHtml(d.person_name)}</div><div class="remaining mono ${d.isPaid?'done':'owed'}">${fmtMoney(d.remaining)}</div></div>
      <div class="meta">Olingan: ${fmtMoney(d.original_amount)} &nbsp;•&nbsp; Tolangan: ${fmtMoney(d.paidTotal)}</div>
      <div class="date">Qarz olingan: ${fmtDate(d.borrowed_date)}</div>
      ${d.isPaid ? `<div class="paid-badge">✓ Toliq tolangan</div>` : `<div class="actions-row"><button class="btn btn-primary btn-block" data-pay="${d.id}">To'lov qilish</button></div>`}
    </div>`;
}
function renderList(){
  const visible = getVisibleDebts();
  if(state.loading){ return `<div style="padding-top:8px">${Array(3).fill('<div class="skeleton"></div>').join('')}</div>`; }
  if(state.debts.length === 0){ return `<div class="empty"><div class="emoji">💸</div><p>Hozircha qarzlar yoq</p><button class="btn btn-primary" id="emptyAddBtn">+ Birinchi qarzni qoshish</button></div>`; }
  if(visible.length === 0){ return `<div class="empty"><p>Hech narsa topilmadi</p></div>`; }
  return `<div class="section-title">Qarzlarim</div><div class="list">${visible.map(renderDebtCard).join('')}</div>`;
}
function renderDetail(){
  const d = state.debts.find(x=>x.id===state.detailId);
  if(!d) return '';
  const payments = [...(d.payments||[])].sort((a,b)=> new Date(b.payment_date)-new Date(a.payment_date) || new Date(b.created_at)-new Date(a.created_at));
  return `
    <div class="detail-view open"><div class="detail-inner">
      <div class="detail-header"><button class="icon-btn" id="detailBack">${icon('back')}</button><div class="name">${escapeHtml(d.person_name)}</div></div>
      <div class="detail-hero">
        <div class="label">Qolgan qarz</div>
        <div class="remaining mono ${d.isPaid?'done':'owed'}">${fmtMoney(d.remaining)}</div>
        ${d.isPaid ? `<div class="paid-badge">✓ Toliq tolangan</div>` : ''}
        <div class="breakdown">
          <div class="item"><div class="l">Olingan</div><div class="v mono">${fmtMoney(d.original_amount)}</div></div>
          <div class="item"><div class="l">Tolangan</div><div class="v mono">${fmtMoney(d.paidTotal)}</div></div>
          <div class="item"><div class="l">Qolgan</div><div class="v mono">${fmtMoney(d.remaining)}</div></div>
        </div>
        <div class="detail-date">Qarz olingan sana: ${fmtDate(d.borrowed_date)}</div>
        ${d.note ? `<div class="detail-note">${escapeHtml(d.note)}</div>` : ''}
        <div class="detail-actions">
          ${!d.isPaid ? `<button class="btn btn-primary" style="flex:1" data-pay="${d.id}">To'lov qilish</button>` : ''}
          <button class="btn btn-ghost" data-edit-debt="${d.id}">${icon('edit')} Tahrirlash</button>
          <button class="btn btn-danger" data-del-debt="${d.id}">${icon('trash')}</button>
        </div>
      </div>
      <div class="history-title">Tolovlar tarixi</div>
      ${payments.length === 0 ? `<div class="empty" style="padding:24px"><p>Hali tolov kiritilmagan</p></div>` : payments.map(p=>`
        <div class="payment-row">
          <div class="left"><div class="amt mono">${fmtMoney(p.amount)}</div><div class="d">${fmtDate(p.payment_date)}</div>${p.note ? `<div class="note">${escapeHtml(p.note)}</div>` : ''}</div>
          <div class="icons"><div class="icon-sm" data-edit-payment="${p.id}">${icon('edit')}</div><div class="icon-sm" data-del-payment="${p.id}">${icon('trash')}</div></div>
        </div>`).join('')}
      ${payments.length > 0 ? `<div class="history-total"><span>Jami</span><span class="mono">${fmtMoney(d.paidTotal)}</span></div>` : ''}
    </div></div>`;
}
function renderModal(){
  if(!state.modal) return '';
  const m = state.modal;
  let inner = '';
  if(m.type === 'add-debt' || m.type === 'edit-debt'){
    const d = m.payload || {};
    inner = `
      <h2>${m.type==='add-debt' ? "Yangi qarz qo'shish" : "Qarzni tahrirlash"}</h2>
      <div class="field"><label>Kimdan oldim?</label><input id="f_name" type="text" value="${escapeAttr(d.person_name||'')}" placeholder="Ism"></div>
      <div class="field"><label>Qarz summasi</label><input id="f_amount" type="number" min="0.01" step="0.01" value="${d.original_amount||''}" placeholder="1000"></div>
      <div class="field"><label>Qarz olingan sana</label><input id="f_date" type="date" value="${d.borrowed_date||todayStr()}"></div>
      <div class="field"><label>Izoh (ixtiyoriy)</label><textarea id="f_note" placeholder="Izoh...">${escapeHtml(d.note||'')}</textarea></div>
      ${m.error ? `<div class="field-error">${escapeHtml(m.error)}</div>` : ''}
      <div class="sheet-actions">
        <button class="btn btn-ghost btn-block" id="modalCancel">Bekor qilish</button>
        <button class="btn btn-primary btn-block" id="modalSaveDebt" data-id="${d.id||''}" data-editing="${m.type==='edit-debt'}">${m.type==='add-debt' ? "Qarz qo'shish" : "Saqlash"}</button>
      </div>`;
  } else if(m.type === 'payment' || m.type === 'edit-payment'){
    const p = m.payload || {};
    inner = `
      <h2>${m.type==='payment' ? "To'lov qo'shish" : "To'lovni tahrirlash"}</h2>
      <div class="field"><label>To'lov summasi</label><input id="f_pamount" type="number" min="0.01" step="0.01" value="${p.amount||''}" placeholder="200"></div>
      <div class="field"><label>To'lov sanasi</label><input id="f_pdate" type="date" value="${p.payment_date||todayStr()}"></div>
      <div class="field"><label>Izoh (ixtiyoriy)</label><textarea id="f_pnote" placeholder="Izoh...">${escapeHtml(p.note||'')}</textarea></div>
      ${m.error ? `<div class="field-error">${escapeHtml(m.error)}</div>` : ''}
      <div class="sheet-actions">
        <button class="btn btn-ghost btn-block" id="modalCancel">Bekor qilish</button>
        <button class="btn btn-primary btn-block" id="modalSavePayment" data-debtid="${p.debt_id||''}" data-id="${p.id||''}" data-editing="${m.type==='edit-payment'}">Saqlash</button>
      </div>`;
  } else if(m.type === 'confirm-delete-debt'){
    inner = `<h2>Qarzni ochirish</h2><div class="confirm-sheet"><p>Bu qarzni va unga tegishli barcha tolovlarni ochirishni xohlaysizmi? Bu amalni bekor qilib bolmaydi.</p></div>
      <div class="sheet-actions"><button class="btn btn-ghost btn-block" id="modalCancel">Bekor qilish</button><button class="btn btn-danger btn-block" id="confirmDeleteDebt" data-id="${m.payload.id}">Ochirish</button></div>`;
  } else if(m.type === 'confirm-delete-payment'){
    inner = `<h2>To'lovni ochirish</h2><div class="confirm-sheet"><p>Bu tolov yozuvini ochirishni xohlaysizmi? Qolgan qarz qayta hisoblanadi.</p></div>
      <div class="sheet-actions"><button class="btn btn-ghost btn-block" id="modalCancel">Bekor qilish</button><button class="btn btn-danger btn-block" id="confirmDeletePayment" data-id="${m.payload.id}">Ochirish</button></div>`;
  }
  return `<div class="overlay open" id="modalOverlay"><div class="sheet"><div class="sheet-handle"></div>${inner}</div></div>`;
}
function renderSettings(){
  if(!state.settingsOpen) return '';
  const options = Object.keys(CURRENCIES).map(code => `<option value="${code}" ${state.currency===code?'selected':''}>${code} — ${CURRENCIES[code].name}</option>`).join('');
  return `<div class="overlay open" id="settingsOverlay"><div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Sozlamalar</h2>
    <div class="field"><label>Valyuta</label><select id="currencySelect">${options}</select></div>
    <div class="field"><label>Hisob</label><div style="font-size:13.5px;color:var(--muted)">${escapeHtml(state.session && state.session.user ? state.session.user.email : '')}</div></div>
    <div class="sheet-actions"><button class="btn btn-ghost btn-block" id="settingsClose">Yopish</button><button class="btn btn-danger btn-block" id="logoutBtn">Chiqish</button></div>
  </div></div>`;
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function render(){
  const app = document.getElementById('app');
  if(!state.session){ app.innerHTML = renderAuth(); attachAuthEvents(); return; }
  app.innerHTML = `
    <div class="header">
      <div><h1>Qarzlarim</h1><div class="sub">Shaxsiy qarz boshqaruvi</div></div>
      <div class="header-actions">
        <button class="icon-btn" id="settingsToggle">${icon('gear')}</button>
        <button class="icon-btn" id="themeToggle">${state.theme==='light' ? icon('moon') : icon('sun')}</button>
      </div>
    </div>
    ${state.error ? `<div class="error-banner"><span>${escapeHtml(state.error)}</span><button id="retryBtn">Qaytadan</button></div>` : ''}
    ${renderStats()}
    ${renderControls()}
    ${renderList()}
    ${state.detailId ? renderDetail() : ''}
    ${renderModal()}
    ${renderSettings()}
    <button class="fab" id="fabAdd" aria-label="Qarz qoshish">${icon('plus')}</button>
    <div class="toast ${state.toast?'show':''}">${escapeHtml(state.toast||'')}</div>
  `;
  attachEvents();
}

function attachAuthEvents(){
  const $ = sel => document.querySelector(sel);
  const on = (sel, ev, fn) => { const el = $(sel); if(el) el.addEventListener(ev, fn); };
  on('#tabSignin','click', ()=>{ state.authMode='signin'; state.authError=null; render(); });
  on('#tabSignup','click', ()=>{ state.authMode='signup'; state.authError=null; render(); });
  on('#authSubmit','click', ()=>{
    const email = $('#authEmail').value.trim();
    const password = $('#authPassword').value;
    if(!email || !password){ state.authError = "Email va parolni kiriting."; render(); return; }
    if(state.authMode==='signin') doSignIn(email, password); else doSignUp(email, password);
  });
}

function attachEvents(){
  const $ = sel => document.querySelector(sel);
  const on = (sel, ev, fn) => { const el = $(sel); if(el) el.addEventListener(ev, fn); };

  on('#themeToggle','click', toggleTheme);
  on('#settingsToggle','click', ()=>{ state.settingsOpen = true; render(); });
  on('#settingsClose','click', ()=>{ state.settingsOpen = false; render(); });
  on('#settingsOverlay','click', (e)=>{ if(e.target.id==='settingsOverlay'){ state.settingsOpen=false; render(); } });
  on('#currencySelect','change', e=> setCurrency(e.target.value));
  on('#logoutBtn','click', doLogout);
  on('#retryBtn','click', loadDebts);
  on('#fabAdd','click', ()=> openModal('add-debt', { borrowed_date: todayStr() }));
  on('#emptyAddBtn','click', ()=> openModal('add-debt', { borrowed_date: todayStr() }));

  on('#searchInput','input', e=>{ state.search = e.target.value; renderKeepFocus('#searchInput'); });
  on('#filterSelect','change', e=>{ state.filter = e.target.value; render(); });
  on('#sortSelect','change', e=>{ state.sort = e.target.value; render(); });

  document.querySelectorAll('[data-open-detail]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target.closest('[data-pay]')) return; state.detailId = el.getAttribute('data-open-detail'); render(); });
  });
  document.querySelectorAll('[data-pay]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openModal('payment', { debt_id: el.getAttribute('data-pay'), payment_date: todayStr() }); });
  });
  on('#detailBack','click', ()=>{ state.detailId = null; render(); });

  document.querySelectorAll('[data-edit-debt]').forEach(el=>{
    el.addEventListener('click', ()=>{ const d = state.debts.find(x=>x.id===el.getAttribute('data-edit-debt')); openModal('edit-debt', { ...d }); });
  });
  document.querySelectorAll('[data-del-debt]').forEach(el=>{
    el.addEventListener('click', ()=> openModal('confirm-delete-debt', { id: el.getAttribute('data-del-debt') }));
  });
  document.querySelectorAll('[data-edit-payment]').forEach(el=>{
    el.addEventListener('click', ()=>{ const d = state.debts.find(x=>x.id===state.detailId); const p = d.payments.find(x=>x.id===el.getAttribute('data-edit-payment')); openModal('edit-payment', { ...p }); });
  });
  document.querySelectorAll('[data-del-payment]').forEach(el=>{
    el.addEventListener('click', ()=> openModal('confirm-delete-payment', { id: el.getAttribute('data-del-payment') }));
  });

  on('#modalCancel','click', closeModal);
  on('#modalOverlay','click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

  on('#modalSaveDebt','click', async (e)=>{
    const btn = e.target.closest('button');
    const name = $('#f_name').value.trim();
    const amount = Number($('#f_amount').value);
    const date = $('#f_date').value;
    const note = $('#f_note').value.trim();
    if(!name || !amount || amount<=0 || !date){ state.modal.error = "Iltimos, barcha majburiy maydonlarni toldiring."; render(); return; }
    try{
      if(btn.getAttribute('data-editing')==='true') await updateDebt(btn.getAttribute('data-id'), { person_name:name, original_amount:amount, borrowed_date:date, note });
      else await createDebt({ person_name:name, original_amount:amount, borrowed_date:date, note });
    }catch(err){ state.modal.error = "Saqlashda xatolik yuz berdi: " + err.message; render(); }
  });

  on('#modalSavePayment','click', async (e)=>{
    const btn = e.target.closest('button');
    const amount = Number($('#f_pamount').value);
    const date = $('#f_pdate').value;
    const note = $('#f_pnote').value.trim();
    const editing = btn.getAttribute('data-editing')==='true';
    if(!amount || amount<=0 || !date){ state.modal.error = "Summani va sanani kiriting."; render(); return; }
    try{
      if(editing){
        const debt = state.debts.find(d=> (d.payments||[]).some(p=>p.id===btn.getAttribute('data-id')));
        const otherPaid = (debt.payments||[]).filter(p=>p.id!==btn.getAttribute('data-id')).reduce((s,p)=>s+Number(p.amount),0);
        const maxAllowed = Number(debt.original_amount) - otherPaid;
        if(amount > maxAllowed + 0.0001){ state.modal.error = "To'lov summasi qolgan qarzdan katta bo'lishi mumkin emas."; render(); return; }
        await updatePayment(btn.getAttribute('data-id'), { amount, payment_date:date, note });
      } else {
        const debtId = btn.getAttribute('data-debtid');
        const debt = state.debts.find(d=>d.id===debtId);
        if(amount > debt.remaining + 0.0001){ state.modal.error = "To'lov summasi qolgan qarzdan katta bo'lishi mumkin emas."; render(); return; }
        await createPayment(debtId, { amount, payment_date:date, note });
      }
    }catch(err){ state.modal.error = "Saqlashda xatolik yuz berdi: " + err.message; render(); }
  });

  on('#confirmDeleteDebt','click', async (e)=>{ try{ await deleteDebtFn(e.target.getAttribute('data-id')); }catch(err){ state.modal.error = "Ochirishda xatolik: " + err.message; render(); } });
  on('#confirmDeletePayment','click', async (e)=>{ try{ await deletePaymentFn(e.target.getAttribute('data-id')); }catch(err){ state.modal.error = "Ochirishda xatolik: " + err.message; render(); } });
}

function renderKeepFocus(sel){
  const el = document.querySelector(sel);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.querySelector(sel);
  if(el2){ el2.focus(); if(pos!==null) el2.setSelectionRange(pos,pos); }
}

(async function init(){
  await loadTheme();
  await loadCurrency();
  render();
  const restored = await restoreSession();
  if(restored){ render(); await loadDebts(); }
  else { render(); }
})();
</script>
</body>
</html>
